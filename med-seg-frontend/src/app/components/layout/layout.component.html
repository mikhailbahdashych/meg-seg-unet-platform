<div class="layout">
  <app-sidebar [class.hidden]="!isSidebarOpen"></app-sidebar>
  <main class="main-content">
    <button class="toggle-sidebar-btn" (click)="toggleSidebar()">
      <img [src]="isSidebarOpen ? 'assets/icons/arrows/left.svg' : 'assets/icons/arrows/right.svg'" alt="Toggle sidebar" />
    </button>
    <router-outlet></router-outlet>
  </main>
</div>
