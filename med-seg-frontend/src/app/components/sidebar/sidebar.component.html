<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-header">
    <div class="logo-icon">
      <mat-icon>biotech</mat-icon>
    </div>
    <h2 *ngIf="!collapsed">MedSeg</h2>
  </div>
  <nav class="sidebar-nav">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
      [matTooltip]="collapsed ? 'Home' : ''"
      matTooltipPosition="right"
    >
      <mat-icon class="nav-icon">home</mat-icon>
      <span class="nav-text" *ngIf="!collapsed">Home</span>
    </a>
    <a
      routerLink="/upload"
      routerLinkActive="active"
      class="nav-item"
      [matTooltip]="collapsed ? 'Upload Dataset' : ''"
      matTooltipPosition="right"
    >
      <mat-icon class="nav-icon">cloud_upload</mat-icon>
      <span class="nav-text" *ngIf="!collapsed">Upload Dataset</span>
    </a>
    <a
      routerLink="/train"
      routerLinkActive="active"
      class="nav-item"
      [matTooltip]="collapsed ? 'Train Model' : ''"
      matTooltipPosition="right"
    >
      <mat-icon class="nav-icon">model_training</mat-icon>
      <span class="nav-text" *ngIf="!collapsed">Train Model</span>
    </a>
    <a
      routerLink="/models"
      routerLinkActive="active"
      class="nav-item"
      [matTooltip]="collapsed ? 'My Models' : ''"
      matTooltipPosition="right"
    >
      <mat-icon class="nav-icon">dashboard</mat-icon>
      <span class="nav-text" *ngIf="!collapsed">My Models</span>
    </a>
    <a
      routerLink="/inference"
      routerLinkActive="active"
      class="nav-item"
      [matTooltip]="collapsed ? 'Run Inference' : ''"
      matTooltipPosition="right"
    >
      <mat-icon class="nav-icon">biotech</mat-icon>
      <span class="nav-text" *ngIf="!collapsed">Run Inference</span>
    </a>
    <a
      routerLink="/settings"
      routerLinkActive="active"
      class="nav-item"
      [matTooltip]="collapsed ? 'Settings' : ''"
      matTooltipPosition="right"
    >
      <mat-icon class="nav-icon">settings</mat-icon>
      <span class="nav-text" *ngIf="!collapsed">Settings</span>
    </a>
  </nav>
</aside>
