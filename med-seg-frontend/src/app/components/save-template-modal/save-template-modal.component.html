<div class="modal-overlay" *ngIf="show" (click)="onClose()">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Save Configuration as Template</h2>
      <button class="modal-close" (click)="onClose()" [disabled]="saving">&times;</button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label for="templateName">Template Name *</label>
        <input
          id="templateName"
          type="text"
          [value]="templateName"
          (input)="onTemplateNameChange($any($event.target).value)"
          placeholder="e.g., Production Config"
          [disabled]="saving"
        />
      </div>

      <div class="form-group">
        <label for="templateDescription">Description (Optional)</label>
        <textarea
          id="templateDescription"
          [value]="templateDescription"
          (input)="onTemplateDescriptionChange($any($event.target).value)"
          placeholder="Describe what makes this template useful..."
          rows="3"
          [disabled]="saving"
        ></textarea>
      </div>

      <p class="help-text">This will save the architecture and training parameters from this configuration.</p>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" (click)="onClose()" [disabled]="saving">
        Cancel
      </button>
      <button class="btn-primary" (click)="onSave()" [disabled]="saving">
        <span *ngIf="!saving">Save Template</span>
        <span *ngIf="saving">
          <span class="spinner"></span>
          Saving...
        </span>
      </button>
    </div>
  </div>
</div>
