<div class="home-page">
  <h1>Welcome to MedSeg Platform</h1>
  <p class="subtitle">U-Net Medical Image Segmentation</p>

  <div class="features">
    <div class="feature-card" [routerLink]="['/upload']">
      <div class="feature-icon">📤</div>
      <h3>Upload Dataset</h3>
      <p>Upload medical image datasets for training</p>
    </div>

    <div class="feature-card" [routerLink]="['/train']">
      <div class="feature-icon">🧠</div>
      <h3>Train Model</h3>
      <p>Configure and train U-Net models</p>
    </div>

    <div class="feature-card" [routerLink]="['/models']">
      <div class="feature-icon">📊</div>
      <h3>My Models</h3>
      <p>View and manage trained models</p>
    </div>
  </div>
</div>
