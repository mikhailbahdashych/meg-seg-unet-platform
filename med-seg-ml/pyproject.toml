[project]
name = "med-seg-ml"
version = "0.1.0"
description = "U-Net medical image segmentation training scripts"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "boto3>=1.28.0",
    "albumentations>=1.3.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "scikit-image>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
