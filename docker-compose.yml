services:
  # Backend Service
  backend:
    build:
      context: ./med-seg-backend
      dockerfile: Dockerfile
    container_name: medseg-backend
    ports:
      - "4201:4201"
    environment:
      - NODE_ENV=production
      - API_PORT=4201
    volumes:
      # Mount med-seg-ml directory for training scripts
      - ./med-seg-ml:/app/med-seg-ml:ro
      # Persistent database storage
      - backend-data:/app/data
    networks:
      - medseg-network
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./med-seg-frontend
      dockerfile: Dockerfile
    container_name: medseg-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - medseg-network
    restart: unless-stopped

# Network for inter-container communication
networks:
  medseg-network:
    driver: bridge

# Volumes for persistent data
volumes:
  backend-data:
    driver: local
